<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dishwasher Load Optimizer</title>
  <style>
    :root { --bg:#12161c; --panel:#1b212a; --line:#2c3541; --text:#e6ebf2; --dim:#8b97a8; --accent:#4f8cff; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
    #app { display:grid; grid-template-columns: 1fr 320px; height:100%; }
    #view { position:relative; min-width:0; }
    canvas { display:block; width:100%; height:100%; }
    #panel { background:var(--panel); border-left:1px solid var(--line); padding:14px; overflow:auto; }
    h2 { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; }
    h2:first-child { margin-top:0; }
    button { background:#242d3a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
    button:hover { border-color:var(--accent); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; align-items:center; }
    .stat { display:grid; grid-template-columns: 1fr auto; padding:2px 0; }
    .stat b { font-variant-numeric: tabular-nums; }
    .big { font-size:30px; font-weight:600; font-variant-numeric: tabular-nums; }
    #dishes { display:flex; flex-direction:column; gap:3px; }
    .dish { display:grid; grid-template-columns: 64px 1fr 40px; gap:8px; align-items:center; padding:4px 6px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
    .dish.sel { border-color:var(--accent); background:#202a3a; }
    .bar { height:6px; background:#2a3340; border-radius:3px; overflow:hidden; }
    .bar i { display:block; height:100%; }
    label.ctl { display:grid; grid-template-columns: 52px 1fr 40px; gap:8px; align-items:center; margin:4px 0; color:var(--dim); }
    label.ctl output { text-align:right; color:var(--text); font-variant-numeric: tabular-nums; }
    input[type=range] { width:100%; }
    select { background:#242d3a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px; font:inherit; }
    #hint { position:absolute; left:12px; bottom:10px; color:#f2c14e; background:rgba(18,22,28,.72); padding:4px 10px; border-radius:6px; pointer-events:none; }
    #status { color:var(--dim); min-height:18px; }
    .legend { height:8px; border-radius:4px; background:linear-gradient(90deg,#d6453d,#e8b83a,#3fbf6a); margin:6px 0 2px; }
    .legend + div { display:flex; justify-content:space-between; color:var(--dim); font-size:11px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="view"><div id="hint">while carrying: Q/E turn · W/S tilt · A/D roll · X delete</div></div>
    <div id="panel">
      <h2>Result</h2>
      <div class="big" id="score">–</div>
      <div id="resultnote" style="color:var(--dim);font-size:12px;min-height:16px;margin-bottom:4px"></div>
      <div class="stat"><span>Soil removed (avg)</span><b id="mean">–</b></div>
      <div class="stat"><span>Dirtiest dishes</span><b id="worst">–</b></div>
      <div class="legend"></div><div><span>dirty</span><span>clean</span></div>

      <h2>Actions</h2>
      <div class="row">
        <button id="clear">Clear all dishes</button>
      </div>
      <div class="row">
        <button id="wash">▶ Start wash</button>
        <select id="speed"><option value="1">1× (15 min)</option><option value="10">10×</option><option value="30" selected>30×</option><option value="60">60×</option><option value="120">120×</option></select>
      </div>
      <div class="bar" style="margin:4px 0 8px"><i id="washbar" style="width:0;background:var(--accent)"></i></div>
      <div id="status"></div>

      <h2>Cycle</h2>
      <label class="ctl" style="grid-template-columns:78px 1fr"><span>Program</span>
        <select id="program"><option value="heavy">Heavy</option><option value="auto">Auto</option><option value="normal" selected>Normal</option><option value="speed60">Speed 60</option></select></label>
      <label class="ctl" style="grid-template-columns:78px 1fr"><span>Water temp</span>
        <select id="temp"><option value="40">40 °C (eco)</option><option value="50">50 °C</option><option value="55" selected>55 °C</option><option value="65">65 °C (intensive)</option></select></label>
      <label class="ctl" style="grid-template-columns:78px 1fr"><span>Detergent</span>
        <select id="det"><option value="0">none</option><option value="0.5">½ dose</option><option value="1" selected>1 dose</option><option value="1.5">1½ doses</option></select></label>
      <div class="stat"><span>Water temp now</span><b id="gt">–</b></div>
      <div class="stat"><span>Detergent now</span><b id="gd">–</b></div>

      <h2>Machine</h2>
      <div class="row">
        <button id="door-btn">Open door</button>
        <button id="lower-btn">Pull lower rack out</button>
        <button id="upper-btn">Pull upper rack out</button>
      </div>

      <h2>Load</h2>
      <div id="dishes"></div>

      <h2>Selected</h2>
      <div id="sel"><span style="color:var(--dim)">Click a dish.</span></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
